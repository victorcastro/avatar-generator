name: Pull Request Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Fetch main
        run: git fetch origin main --depth=1

      - name: Validate version bump vs main
        run: |
          MAIN_VERSION="$(git show origin/main:package.json | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>console.log(JSON.parse(d).version))')"
          PR_VERSION="$(node -p "require('./package.json').version")"
          echo "main=$MAIN_VERSION pr=$PR_VERSION"

          if ! [[ "$PR_VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version '$PR_VERSION' is not in the form X.Y"
            exit 1
          fi

          MAIN_X="${MAIN_VERSION%%.*}"; MAIN_Y="${MAIN_VERSION##*.}"
          PR_X="${PR_VERSION%%.*}"; PR_Y="${PR_VERSION##*.}"

          if [[ "$PR_X" == "$MAIN_X" && "$PR_Y" == "$((MAIN_Y + 1))" ]]; then
            :
          elif [[ "$PR_X" == "$((MAIN_X + 1))" && "$PR_Y" == "0" ]]; then
            :
          else
            echo "::error::Invalid version bump: main=$MAIN_VERSION pr=$PR_VERSION (expected minor+1, or major+1 with Y=0)"
            exit 1
          fi

      - name: Validate CHANGELOG entry
        run: |
          TOP_HEADING="$(grep -m1 '^## \[' CHANGELOG.md)"
          PR_VERSION="$(node -p "require('./package.json').version")"

          if ! echo "$TOP_HEADING" | grep -Eq "^## \[$PR_VERSION\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$"; then
            echo "::error::First CHANGELOG.md entry must be '## [$PR_VERSION] - YYYY-MM-DD', found: $TOP_HEADING"
            exit 1
          fi

          if git show origin/main:CHANGELOG.md | grep -qF "$TOP_HEADING"; then
            echo "::error::Entry '$TOP_HEADING' already exists in main's CHANGELOG.md"
            exit 1
          fi

  quality:
    runs-on: ubuntu-latest
    needs: validate-version

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check syntax
        run: |
          node --check build.js
          node --check server.js
          find src/scripts -name '*.js' -exec node --check {} +

      - name: Run linter
        run: yarn lint

      - name: Run unit tests
        run: yarn test

  build:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build static export
        run: yarn build
